<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Laboratorio | Médico Amigo</title><link rel="stylesheet" href="lab.css"></head><body><main class="wrap"><header><div><small>MÉDICO AMIGO</small><h1>🔬 Laboratorio Los Pinos</h1><p>Carga segura de resultados · acceso restringido</p></div><a href="./">Volver a Médico Amigo</a></header><section class="notice">MÓDULO DE PRUEBA. Utiliza únicamente el paciente y el PDF ficticios. El acceso debe estar autorizado por Supabase.</section><section id="loginBox" class="panel"><h2>Ingresar al laboratorio</h2><form id="labLogin"><label>Correo<input id="labEmail" type="email" autocomplete="username" required></label><label>Contraseña<input id="labPassword" type="password" autocomplete="current-password" required></label><button>Ingresar</button></form></section><section id="workspace" class="panel hidden"><div class="between"><h2>Resultados de laboratorio</h2><button id="labLogout" type="button" class="muted">Cerrar sesión</button></div><p id="labUser"></p><label>Buscar paciente autorizado por nombre o documento<input id="labQuery" type="search" placeholder="PACIENTE PRUEBA LABORATORIO" minlength="2"></label><button id="labSearch" type="button">Buscar pacientes</button><div id="labPatients" class="results"></div><form id="labUpload" class="hidden"><h3 id="labChosen">Paciente seleccionado</h3><label>Nombre del estudio<input id="labStudy" maxlength="150" value="Hemograma, química sanguínea y examen de orina" required></label><label>Fecha del estudio<input id="labDate" type="date" required></label><label>Resultado PDF (máximo 10 MB)<input id="labFile" type="file" accept="application/pdf,.pdf" required></label><button id="labSend" type="submit">Cargar resultado PDF</button></form></section><p id="labStatus" role="status" aria-live="polite"></p></main><script src="lab.js"></script></body></html>
